<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor Animada Mejorada </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="text-above">🌸 De: John 🌸</div>

        <div class="flower">
            <!-- Pétalos externos -->
            <div class="Petal4 p1"></div>
            <div class="Petal4 p2"></div>
            <div class="Petal4 p3"></div>
            <div class="Petal4 p4"></div>

            <!-- Pétalos medios -->
            <div class="Petal3 p1"></div>
            <div class="Petal3 p2"></div>
            <div class="Petal3 p3"></div>
            <div class="Petal3 p4"></div>

            <!-- Pétalos internos -->
            <div class="Petal2 p1"></div>
            <div class="Petal2 p2"></div>
            <div class="Petal2 p3"></div>
            <div class="Petal2 p4"></div>

            <!-- Pétalos centrales -->
            <div class="Petal1 p1"></div>
            <div class="Petal1 p2"></div>
            <div class="Petal1 p3"></div>
            <div class="Petal1 p4"></div>

            <!-- Centro de la flor -->
            <div class="mid"></div>

            <!-- Partículas brillantes -->
            <div class="sparkle s1"></div>
            <div class="sparkle s2"></div>
            <div class="sparkle s3"></div>
            <div class="sparkle s4"></div>
        </div>

        <div class="text-below">✨ Para: mi angel de la guarda 💛💛 ✨</div>

        <!-- Efectos de fondo -->
        <div class="background-effects">
            <div class="floating-particle p1"></div>
            <div class="floating-particle p2"></div>
            <div class="floating-particle p3"></div>
        </div>
    </div>
</body>

</html>
