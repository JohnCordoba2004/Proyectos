<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Metadatos y viewport para diseño responsive -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- Enlace a los estilos de la tarjeta -->
  <link rel="stylesheet" href="style.css">
  <!-- Fin head -->
  
</head>

<body>
  <main class="container">
    <!-- Tarjeta con imagen a la izquierda y contenido a la derecha -->
    <section class="card">
      <!-- Contenedor circular para la imagen -->
      <div class="card card-img">
        <img src="assets/img/Bulbasaur.png" alt="card img">
      </div>
      <!-- Contenedor del texto -->
      <div class="card card-content">
        <h2>Bulbasaur</h2>
        <div class="text-content">
          <p>Bulbasaur es un Pokémon de tipo planta/veneno conocido por la semilla en su espalda, la cual crece al
            absorber los rayos del sol.</p>
          <!-- Botón de acción para más información -->
          <a href="#" target="_blank" class="btn">Conoce más</a>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
