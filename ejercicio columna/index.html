<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Columnas</title>
  <!-- Enlace a los estilos de la página -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <!-- Columna izquierda: imagen -->
    <div class="image-section">
      <img src="naruto feliz.jpg" alt="image-naruto">
    </div>

    <!-- Columna derecha: título, descripción y botón -->

      <h1>Naruto Uzumaki 🦊</h1>
      <p>Naruto es el ninja más travieso de Konoha, experto en meterse en líos y en comer ramen. Sueña con ser Hokage,
        aunque a veces parece que solo quiere hacer reír a todos con sus bromas y su energía inagotable.</p>
      <a href="../Error 404/index.html" class="btn">Conoceme mas acá</a>
    </div>
  </main>
</body>

</html>
