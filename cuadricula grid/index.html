<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Metadatos básicos y viewport para diseño responsive -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Grid</title>
  <!-- Enlace a los estilos de la cuadrícula -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="bento-grid">
    <!-- Tarjeta grande: texto de marketing y una imagen -->
    <section class="card card-large">
      <div class="card-content">
        <h2>Epic Web</h2>
        <p>Become a fullstack web developer.</p>
        <!-- Botón con flecha que aparece al pasar el mouse -->
        <a href="#" class="btn">
          Hover me <span class="arrow">→</span>
        </a>
      </div>

      <div class="card-img">
        <img src="https://placehold.co/200" alt="Course Image">
      </div>

    </section>

    <!-- Tarjeta pequeña #1: curso de React (placeholder) -->
    <section class="card card-small">
      <div class="react-card">
        <img src="https://placehold.co/200" alt="react course">
        <div class="text-group">
          <div class="text-content">
            <h2>Epic Web</h2>
            <p>The most comprehensive guide for pros.</p>
          </div>
          <!-- Botón circular moderno con flecha diagonal -->
          <a href="#" class="modern-btn" aria-label="Visit course">
            <span>↗️</span>
          </a>
        </div>
      </div>
    </section>

    <!-- Tarjeta pequeña #2: curso de testing (placeholder) -->
    <section class="card card-small">
      <div class="testing-card">
        <img src="https://placehold.co/200" alt="testing course">
        <div class="text-group">
          <div class="text-content">
            <h2>Epic Web</h2>
            <p>The most comprehensive guide for pros.</p>
          </div>
          <a href="#" class="modern-btn" aria-label="Visit course">
            <span>↗️</span>
          </a>
        </div>
      </div>
    </section>

  </main>
</body>

</html>
